name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy source
        run: |
          rsync -az --delete \
            --exclude=".env" \
            --exclude=".git/" \
            --exclude="vendor/" \
            --exclude="node_modules/" \
            --exclude="storage/" \
            --exclude="bootstrap/cache/" \
            ./ /var/www/LALAVEL_CHOBO/

      - name: Run Laravel deploy script
        run: |
          cd /var/www/LALAVEL_CHOBO
          bash deploy.sh
